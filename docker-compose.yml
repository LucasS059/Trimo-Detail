services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: trimo-evolution-api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8082}:8080"
    env_file:
      - .env.local
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8082}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_URL}
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - WEBSOCKET_ENABLED=true
      - CONFIG_SESSION_PHONE_CLIENT=Trimo Detail
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1047359146
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances: